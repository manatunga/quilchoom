[project]
name = "quilchoom"
version = "0.1.0"
description = "Turn development history into traceable project knowledge and documentation."
readme = "README.md"
authors = [
    { name = "Janitha Manatunga", email = "janithamanatunga@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE*"]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.1",
    "typer>=0.27.2",
]
keywords = [
    "developer-tools",
    "documentation",
    "git",
    "knowledge-management",
    "llm",
    "project-documentation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/manatunga/quilchoom"
Repository = "https://github.com/manatunga/quilchoom"
Issues = "https://github.com/manatunga/quilchoom/issues"

[project.scripts]
quilchoom = "quilchoom.cli:app"
qlchm = "quilchoom.cli:app"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
