[project]
name = "quilchoom"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "manatunga", email = "janithamanatunga@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.1",
    "typer>=0.27.2",
]

[project.scripts]
quilchoom = "quilchoom.cli:app"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.20.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
